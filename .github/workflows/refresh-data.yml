name: Refresh map data

# Weekly refresh of pubs (OpenStreetMap) and sights (OpenStreetMap, Open Plaques,
# Wikidata popularity) for every city in v2/cities.json. The build refuses a
# refresh that shrinks a dataset by more than 30%, so a flaky upstream API
# cannot wipe the map.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      cities:
        description: "Cities to refresh (comma-separated ids from v2/cities.json, or all)"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install OSM extract tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install osmium
      - name: Which data sources can this runner reach?
        continue-on-error: true
        run: |
          q='[out:json][timeout:25];node["amenity"="pub"](53.955,-1.09,53.965,-1.07);out 1;'
          for u in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            echo "overpass $u -> $(curl -s -m 40 -o /dev/null -w '%{http_code} %{time_total}s' --data-urlencode "data=$q" "$u")"
          done
          echo "ohsome GET metadata -> $(curl -s -m 30 -o /dev/null -w '%{http_code}' https://api.ohsome.org/v1/metadata)"
          echo "ohsome POST -> $(curl -s -m 60 -o /dev/null -w '%{http_code}' -d 'bboxes=-1.09,53.955,-1.07,53.965' -d 'filter=amenity=pub' https://api.ohsome.org/v1/elements/count)"
          echo "geofabrik -> $(curl -s -m 30 -o /dev/null -L -I -w '%{http_code} %{url_effective}' https://download.geofabrik.de/europe/united-kingdom/england-latest.osm.pbf)"
      - name: Fetch fresh data and rebuild the site
        run: python3 v2/build_v2.py --refresh-all --cities "${{ github.event.inputs.cities || 'all' }}" --publish-docs
      - name: Unit tests against the new data
        run: npm test
      - name: Keep the built data for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: built-data
          path: |
            v2/data/*.geojson
            v2/public/data/places-*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Commit if anything changed
        run: |
          git add -A v2/data
          if git diff --cached --quiet -- v2/data; then
            echo "Data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/data v2/public docs
          git commit -m "Refresh pub and sight data (${{ github.event.inputs.cities || 'all' }})"
          git push
